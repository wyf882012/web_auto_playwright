基础配置:
  用例类型: WebCase   #区分用例app,api，web
  一级模块: 我的反馈登陆  #生成测试报告分功能展示
  二级模块: 反馈功能
  用例标题: 反馈测试用例

用例步骤:
- 点击我的书架:
    操作类型: 点击元素
    _页面元素: 点击我的书架
- 强制等待:
    操作类型: 强制等待
    数据内容: '3'
- 点击我的反馈:
    操作类型: 点击元素
    _页面元素: 点击我的反馈
- 点击写反馈按钮:
    操作类型: 点击元素
    _页面元素: 点击反馈_按钮
- 强制等待:
    操作类型: 强制等待
    数据内容: '3'
- 输入反馈内容:
    操作类型: 输入内容
    _页面元素: 输入反馈内容
    数据内容: '{{feedbackData}}'
- 点击反馈提交按钮:
    操作类型: 点击元素
    _页面元素: 点击反馈提交按钮

- 确定登录成功用户名正确:
    操作类型: 获取元素文本
    _页面元素: 检查是否反馈成功
    变量名: page_name

- 检查是否反馈成功:
    操作类型: 断言文本包含
    预期结果: '{{feedbackData}}'
    实际结果: "{{page_name}}"
- 强制等待:
    操作类型: 强制等待
    数据内容: 1
