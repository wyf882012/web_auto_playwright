基础配置:
  用例类型: WebCase   #区分用例app,api，web
  一级模块: 我的登陆  #生成测试报告分功能展示
  二级模块: 登陆功能
  用例标题: 登陆测试用例

用例步骤:
- 进入到登录页面:
    操作类型: 访问网址
    网址: http://novel.hctestedu.com/user/login.html
- 输入用户名:
    操作类型: 输入内容
    数据内容: '{{username}}'
    _页面元素: 手机号_输入框

- 输入密码:
    操作类型: 输入内容
    数据内容: '{{password}}'
    _页面元素: 密码_输入框

- 点击确定按钮:
    操作类型: 点击元素
    _页面元素: 登陆_按钮

- 强制等待:
    操作类型: 强制等待
    数据内容: '3'

- 判断是否跳转到登录页面:
    操作类型: 断言浏览器路径
    数据内容: '{{expect}}'

数据驱动:
  - username: 15574113907
    password: 123456
    描述标题: 用户名和密码都正确
    expect: http://novel.hctestedu.com/
