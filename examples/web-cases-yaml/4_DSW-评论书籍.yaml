基础配置:
  用例类型: WebCase   #区分用例app,api，web
  一级模块: 读书屋评论书籍  #生成测试报告分功能展示
  二级模块: 评论书籍功能
  用例标题: DSW-评论书籍

用例步骤:
- 点击我的书架:
    操作类型: 点击元素
    _页面元素: 我的书架
- 点击继续阅读:
    操作类型: 点击元素
    _页面元素: 我的书架最新-继续阅读
- 点击评价按钮:
    操作类型: 点击元素
    _页面元素: 评价按钮
- 点击发表评价按钮:
    操作类型: 点击元素
    _页面元素: 发布评价
- 输入评价内容:
    操作类型: 输入内容
    _页面元素: 评价文本框
    数据内容: 柚一来评价
- 强制等待:
    操作类型: 强制等待
    数据内容: '1'
- 点击发表按钮:
    操作类型: 点击元素
    _页面元素: 发表按钮

- 确定登录成功用户名正确:
    操作类型: 获取元素文本
    _页面元素: 评价成功弹窗信息
    变量名: page_name

- 检查是否反馈成功:
    操作类型: 断言文本包含
    预期结果:  已评价过该书籍！
    实际结果: "{{page_name}}"

- 强制等待:
    操作类型: 强制等待
    数据内容: '3'