基础配置:
  用例类型: WebCase   #区分用例app,api，web
  一级模块: 加入书架  #生成测试报告分功能展示
  二级模块: 加入书架功能
  用例标题: 加入书架用例

用例步骤:
- 点击对应的书籍:
    操作类型: 点击元素
    _页面元素: 搜索列表书籍-第一本书
- 强制等待:
    操作类型: 强制等待
    数据内容: '3'
- 点击加入书架按钮:
    操作类型: 点击元素
    _页面元素: 加入书架按钮
- 进入到我的书架页面:
    操作类型: 点击元素
    _页面元素: 我的书架

- 确定登录成功用户名正确:
    操作类型: 获取元素文本
    _页面元素: 我的书架最新书名
    变量名: page_name

- 检查是否反馈成功:
    操作类型: 断言文本包含
    预期结果: '{{bookName}}'
    实际结果: "{{page_name}}"

- 强制等待:
    操作类型: 强制等待
    数据内容: '3'