基础配置:
  用例类型: WebCase   #区分用例app,api，web
  一级模块: 我的登陆  #生成测试报告分功能展示
  二级模块: 登陆功能
  用例标题: 登陆测试用例

用例步骤:
- 输入书籍名称:
    操作类型: 输入内容
    数据内容: '{{bookName}}'
    _页面元素: 书籍搜索框
- 点击搜索按钮:
    操作类型: 点击元素
    _页面元素: 书籍搜索按钮

- 确定登录成功用户名正确:
    操作类型: 获取元素文本
    _页面元素: 搜索列表书籍-第一本书
    变量名: page_name

- 检查是否反馈成功:
    操作类型: 断言文本包含
    预期结果: '{{bookName}}'
    实际结果: "{{page_name}}"
- 强制等待:
    操作类型: 强制等待
    数据内容: '3'

数据驱动:
  - bookName: 同一天天