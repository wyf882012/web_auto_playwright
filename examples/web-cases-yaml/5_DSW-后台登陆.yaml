基础配置:
  用例类型: WebCase   #区分用例app,api，web
  一级模块: 读书屋后台登陆  #生成测试报告分功能展示
  二级模块: 后台登陆功能
  用例标题: DSW-后台登录测试用例

用例步骤:
- 打开后台管理平台:
    操作类型: 访问网址
    网址: http://novel-admin.hctestedu.com/login
- 输入用户名:
    操作类型: 输入内容
    _页面元素: 后台用户名
    数据内容: 测试权限账号
- 输入密码:
    操作类型: 输入内容
    _页面元素: 后台密码
    数据内容: ceshiquanxianzhanghao
- 识别对应的图片验证码:
    操作类型: image_recognition
    _页面元素: 后台验证码
    引用变量: codeData
- 输入验证码:
    操作类型: 输入内容
    _页面元素: 输入验证码
    数据内容: '{{codeData}}'
- 点击登录按钮:
    操作类型: 点击元素
    _页面元素: 后台登陆按钮
- 强制等待:
    操作类型: 强制等待
    数据内容: '3'
