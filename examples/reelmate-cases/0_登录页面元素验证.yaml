基础配置:
  用例类型: WebCase
  一级模块: 登录模块
  二级模块: 登录页面
  用例标题: 登录页面元素完整性验证

用例步骤:
- 访问首页:
    操作类型: 访问网址
    网址: "{{base_url}}"
    等待方式: load

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 查找并点击登录入口:
    操作类型: 点击元素
    _页面元素: 登录入口按钮

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 获取当前URL:
    操作类型: 获取当前URL
    变量名: login_page_url

- 获取页面标题:
    操作类型: 获取页面标题
    变量名: login_page_title

- 验证用户名输入框存在:
    操作类型: 断言元素存在
    _页面元素: 用户名输入框
    超时: "10000"

- 验证密码输入框存在:
    操作类型: 断言元素存在
    _页面元素: 密码输入框

- 验证登录按钮存在:
    操作类型: 断言元素存在
    _页面元素: 登录提交按钮
