基础配置:
  用例类型: WebCase
  一级模块: 登录模块
  二级模块: 登录功能
  用例标题: 正确账号密码登录成功

用例步骤:
- 访问首页:
    操作类型: 访问网址
    网址: "{{base_url}}"
    等待方式: load

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 点击登录入口:
    操作类型: 点击元素
    _页面元素: 登录入口按钮

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 输入账号:
    操作类型: 输入内容
    数据内容: "{{username}}"
    _页面元素: 用户名输入框

- 输入密码:
    操作类型: 输入内容
    数据内容: "{{password}}"
    _页面元素: 密码输入框

- 强制等待:
    操作类型: 强制等待
    数据内容: "1"

- 点击登录提交:
    操作类型: 点击元素
    _页面元素: 登录提交按钮

- 等待跳转:
    操作类型: 强制等待
    数据内容: "5"

- 获取当前URL:
    操作类型: 获取当前URL
    变量名: after_login_url

- 获取页面标题:
    操作类型: 获取页面标题
    变量名: after_login_title

- 验证登录成功_不在登录页:
    操作类型: 断言文本不相等
    预期结果: "{{login_url}}"
    实际结果: "{{after_login_url}}"
    错误信息: "登录失败，URL仍在登录页面"

