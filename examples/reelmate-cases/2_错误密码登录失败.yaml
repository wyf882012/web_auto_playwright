基础配置:
  用例类型: WebCase
  一级模块: 登录模块
  二级模块: 登录功能
  用例标题: 错误密码登录失败验证

用例步骤:
- 访问首页:
    操作类型: 访问网址
    网址: "{{base_url}}"
    等待方式: load

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 点击登录入口:
    操作类型: 点击元素
    _页面元素: 登录入口按钮

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 输入正确账号:
    操作类型: 输入内容
    数据内容: "{{username}}"
    _页面元素: 用户名输入框

- 输入错误密码:
    操作类型: 输入内容
    数据内容: "{{wrong_password}}"
    _页面元素: 密码输入框

- 强制等待:
    操作类型: 强制等待
    数据内容: "1"

- 点击登录提交:
    操作类型: 点击元素
    _页面元素: 登录提交按钮

- 等待响应:
    操作类型: 强制等待
    数据内容: "3"

- 获取当前URL:
    操作类型: 获取当前URL
    变量名: current_url

- 验证未跳转_仍在登录页:
    操作类型: 断言文本包含
    预期结果: "{{login_url}}"
    实际结果: "{{current_url}}"
    错误信息: "错误密码不应登录成功"

数据驱动:
  - username: "18318053665"
    wrong_password: "wrongpassword123"
    描述标题: 正确账号+错误密码
