基础配置:
  用例类型: WebCase
  一级模块: 登录模块
  二级模块: 登录功能
  用例标题: 格式错误账号登录校验

用例步骤:
- 访问首页:
    操作类型: 访问网址
    网址: "{{base_url}}"
    等待方式: load

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 点击登录入口:
    操作类型: 点击元素
    _页面元素: 登录入口按钮

- 强制等待:
    操作类型: 强制等待
    数据内容: "3"

- 输入格式错误账号:
    操作类型: 输入内容
    数据内容: "{{invalid_account}}"
    _页面元素: 用户名输入框

- 输入密码:
    操作类型: 输入内容
    数据内容: "{{password}}"
    _页面元素: 密码输入框

- 点击登录提交:
    操作类型: 点击元素
    _页面元素: 登录提交按钮

- 强制等待:
    操作类型: 强制等待
    数据内容: "2"

- 获取当前URL:
    操作类型: 获取当前URL
    变量名: current_url

- 验证仍在登录页:
    操作类型: 断言文本包含
    预期结果: "{{login_url}}"
    实际结果: "{{current_url}}"
    错误信息: "格式错误账号不应登录成功"

数据驱动:
  - invalid_account: "!@#$%^&*()"
    password: "qq111111"
    描述标题: 特殊字符账号+正确密码
