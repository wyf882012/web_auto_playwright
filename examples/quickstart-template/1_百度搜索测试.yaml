# ============================================================
# 测试用例: 百度搜索基本功能验证
# ============================================================
# 这是最简单的自动化测试用例，演示了:
#   1. 如何打开网页
#   2. 如何输入内容
#   3. 如何点击元素
#   4. 如何验证结果
#
# 每个字段说明见 README.txt
# ============================================================

基础配置:
  用例类型: WebCase                # WebCase 表示 Web 自动化用例
  一级模块: 搜索功能                # Allure 报告中的一级分类
  二级模块: 基本搜索                # Allure 报告中的二级分类
  用例标题: 百度搜索基本功能验证       # 用例名称

用例步骤:
  # 步骤1: 打开百度首页
  - 打开百度首页:
      操作类型: 访问网址
      网址: "{{base_url}}"
      等待方式: load

  # 步骤2: 等待页面加载完成
  - 等待页面加载:
      操作类型: 强制等待
      数据内容: "2"

  # 步骤3: 在搜索框中输入关键词
  # {{变量名}} 会被 context.yaml 中的值替换
  - 输入搜索关键词:
      操作类型: 输入内容
      数据内容: "Playwright自动化测试"
      _页面元素: 搜索框

  # 步骤4: 点击搜索按钮
  - 点击搜索按钮:
      操作类型: 点击元素
      _页面元素: 搜索按钮

  # 步骤5: 等待搜索结果加载
  - 等待搜索结果:
      操作类型: 强制等待
      数据内容: "3"

  # 步骤6: 获取页面标题
  - 获取页面标题:
      操作类型: 获取页面标题
      变量名: page_title

  # 步骤7: 验证标题中包含搜索关键词
  - 验证搜索结果:
      操作类型: 断言文本包含
      预期结果: "Playwright自动化测试"
      实际结果: "{{page_title}}"
      错误信息: "搜索结果页面标题不包含搜索关键词"
