基础配置:
  用例类型: WebCase
  一级模块: 登录模块
  二级模块: POM登录功能
  用例标题: POM登录成功验证

用例步骤:
- 导航到登录页面:
    操作类型: LoginPage.navigate_to_login

- 输入账号:
    操作类型: LoginPage.enter_username
    username: "{{username}}"

- 输入密码:
    操作类型: LoginPage.enter_password
    password: "{{password}}"

- 勾选协议:
    操作类型: LoginPage.agree_to_terms

- 点击登录按钮:
    操作类型: LoginPage.click_login_button

- 等待登录响应:
    操作类型: 强制等待
    数据内容: "5"

- 验证登录成功:
    操作类型: LoginPage.verify_login_success
