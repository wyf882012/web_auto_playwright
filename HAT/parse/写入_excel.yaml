- 基础配置:
    一级模块: 读书屋-WEB-用户模块
    二级模块: 登录功能
    用例标题: 登陆错误的用户名正确的密码
    用例类型: WebCase
  用例步骤:
  - 打开登录页面:
      操作类型: 访问网址
      网址: http://192.168.1.41:18001/user/login.html
  - 输入用户名:
      _页面元素: 登录页面_用户名
      操作类型: 输入内容
      数据内容: 15071113907
  - 输入密码:
      _页面元素: 登录页面_密码
      操作类型: 输入内容
      数据内容: 123456
  - 点击登录:
      _页面元素: 登录页面_登录按钮
      操作类型: 点击元素
  - 等待3秒，用于系统处理:
      操作类型: 强制等待
      数据内容: 3
  - 检查是否登录成功跳转到首页:
      操作类型: 断言浏览器路径
      数据内容: http://192.168.1.41:18001/user/login.html
